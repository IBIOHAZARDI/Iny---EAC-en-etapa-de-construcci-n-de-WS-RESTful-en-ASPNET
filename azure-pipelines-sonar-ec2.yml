trigger: none
pr: none

pool:
  name: Laboratorio-EC2
  demands:
    - Agent.OS -equals Windows_NT

variables:
  appProjectKey: ITM_App---EAC-en-etapa-de-construcci-n-de-WS-RESTful-en-ASPNET_e13968ab-1ea5-4560-be83-1bfb71d5b096
  injectorProjectKey: ITM_Iny---EAC-en-etapa-de-construcci-n-de-WS-RESTful-en-ASPNET_bbf7d49a-bc02-4286-9815-44201d1b99c3
  javaHome: C:\ProgramData\ITM-Lab\services\jdk-21.0.13+9

jobs:
  - job: AnalyzeApp
    displayName: Analizar ambas APIs
    steps:
      - checkout: self
        fetchDepth: 0

      - task: PowerShell@2
        displayName: Compilar y analizar ambas APIs
        inputs:
          targetType: filePath
          filePath: scripts\Invoke-Ec2SonarAnalysis.ps1
          arguments: -Target App
          pwsh: true
        env:
          JAVA_HOME: $(javaHome)
          SONAR_PROJECT_KEY: $(appProjectKey)
          SONAR_ANALYSIS_TOKEN: $(sonarAnalysisToken)

  - job: AnalyzeInjector
    displayName: Analizar SecurityAsserts
    dependsOn: AnalyzeApp
    steps:
      - checkout: self
        fetchDepth: 0

      - task: PowerShell@2
        displayName: Compilar y analizar SecurityAsserts
        inputs:
          targetType: filePath
          filePath: scripts\Invoke-Ec2SonarAnalysis.ps1
          arguments: -Target Injector
          pwsh: true
        env:
          JAVA_HOME: $(javaHome)
          SONAR_PROJECT_KEY: $(injectorProjectKey)
          SONAR_ANALYSIS_TOKEN: $(sonarAnalysisToken)
